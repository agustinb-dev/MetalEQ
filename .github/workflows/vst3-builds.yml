name: VST3 builds

on:
  push:
    branches: [main, webview-ui-migration]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux VST3 (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # WebKitGTK is required by JUCE's WebBrowserComponent on Linux. The
      # -dev packages are what actually matters; the rest are JUCE's own Linux
      # dependencies plus the X11/ALSA/FreeType headers it expects. libgtk-3-dev
      # is listed explicitly because JUCE's browser pkg-config target needs
      # gtk+-x11-3.0, and the test targets compile that browser code too.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            ca-certificates \
            libasound2-dev \
            libfreetype6-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Gui/package-lock.json

      # The React UI is embedded in the binary as a zip via juce_add_binary_data,
      # so it has to be built first. CMake invokes npm itself when it can find
      # it, but installing here keeps the failure (if any) in one clear step.
      - name: Build WebView UI
        working-directory: Gui
        run: |
          npm ci
          npm run build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Collect VST3 bundle
        run: |
          mkdir -p dist
          # juce_add_plugin writes the bundle to
          #   <build>/MetalEQ_artefacts/<Config>/<Format>/MetalEQ.vst3
          # i.e. nested under a VST3/ directory. Prefer the Release bundle, and
          # locate it rather than hardcoding the path so a layout change fails
          # loudly here.
          bundle=$(find build/MetalEQ_artefacts -maxdepth 4 -name 'MetalEQ.vst3' -type d -path '*/Release/*' | head -n 1)
          if [ -z "$bundle" ]; then
            bundle=$(find build/MetalEQ_artefacts -maxdepth 4 -name 'MetalEQ.vst3' -type d | head -n 1)
          fi
          if [ -z "$bundle" ]; then
            echo "No MetalEQ.vst3 bundle found. Artefacts tree:"
            find build/MetalEQ_artefacts -maxdepth 4 | sort
            exit 1
          fi
          echo "Found bundle: $bundle"
          # A .vst3 bundle is a self-contained directory, which is what hosts
          # expect to drop into their VST3 folder.
          cp -r "$bundle" dist/
          find dist -type f | sort

      - name: Package
        run: tar -czf MetalEQ-vst3-linux-x86_64.tar.gz -C dist MetalEQ.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: MetalEQ-vst3-linux-x86_64
          path: MetalEQ-vst3-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows VST3 (x86_64)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      # The WebView2 SDK is downloaded by CMakeLists.txt itself with
      # file(DOWNLOAD), so unlike a Projucer project there is no NuGet step.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Gui/package-lock.json

      - name: Build WebView UI
        working-directory: Gui
        run: |
          npm ci
          npm run build

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect and package VST3 bundle
        shell: pwsh
        run: |
          $all = @(Get-ChildItem -Path build/MetalEQ_artefacts -Recurse -Directory -Filter 'MetalEQ.vst3' -ErrorAction SilentlyContinue)
          $bundle = $all | Where-Object { $_.FullName -match '[\\/]Release[\\/]' } | Select-Object -First 1
          if (-not $bundle) { $bundle = $all | Select-Object -First 1 }
          if (-not $bundle) {
            Write-Host "No MetalEQ.vst3 bundle found. Artefacts tree:"
            Get-ChildItem -Path build/MetalEQ_artefacts -Recurse -Depth 3 | Select-Object -ExpandProperty FullName | Sort-Object
            throw 'MetalEQ.vst3 bundle not found'
          }
          Write-Host "Found bundle: $($bundle.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $bundle.FullName dist/
          Compress-Archive -Path dist/MetalEQ.vst3 -DestinationPath MetalEQ-vst3-windows-x86_64.zip -Force
          Get-ChildItem dist -Recurse -File | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: MetalEQ-vst3-windows-x86_64
          path: MetalEQ-vst3-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish Release
    # Both builds must succeed, and only tagged commits publish. Keeping this
    # in its own job avoids the two build jobs racing to create one release.
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    # gh release create needs to write releases; the build jobs stay read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artefacts
        run: find artifacts -type f | sort

      # Actions artifacts are not Releases: they live on the run page and
      # expire. This attaches both bundles to a real Release, which is what
      # shows up under the repository's releases section.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "MetalEQ ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/MetalEQ-vst3-linux-x86_64/MetalEQ-vst3-linux-x86_64.tar.gz \
            artifacts/MetalEQ-vst3-windows-x86_64/MetalEQ-vst3-windows-x86_64.zip
